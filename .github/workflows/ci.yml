name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    strategy:
      fail-fast: false
      # 全交叉 3x3 时，一次推送要开 9 个 runner；最慢那次 macOS/node 22 卡住 901 s，
      # 把一次发版的尾巴拖成 15 分钟。兼容性真正要证明的是「三个 OS 都能跑」+「node
      # 20/22/24 都能跑」，而不是九个交叉点都跑：ubuntu 三个版本，windows 留 20 与 22
      # （zstd missing 这类差异正是在 node 20 上暴露的），macOS 留 22。
      matrix:
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 20 }
          - { os: windows-latest, node: 22 }
          - { os: macos-latest, node: 22 }
    runs-on: ${{ matrix.os }}
    # 没有上限时，一个卡住的 runner 只能等默认值。8 分钟比全套用例（约 50 s）宽 10 倍，
    # 卡住就红，不再把发版尾巴拖到 15 分钟。
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: toolchain
        run: |
          node --version
          git --version
      - name: self-test
        run: node test/selftest.js

  arch:
    name: arch-health (self-governance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: arch-health
        run: node tools/arch-health.mjs

  parity:
    name: python parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: self-test (python engine)
        run: python3 test/selftest.py

  smoke:
    name: npm pack + global install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: pack and install
        run: |
          npm pack --silent > pack.txt
          tarball=$(tail -n 1 pack.txt)
          npm install -g "./$tarball"
          signoff --version
          git config --global user.name ci
          git config --global user.email ci@example.com
          rm -rf /tmp/guarded && mkdir -p /tmp/guarded && cd /tmp/guarded
          git init -q .
          echo hi > a.txt && git add . && git commit -qm "before guard"
          signoff init --no-ci
          signoff doctor
          echo two > b.txt && git add . && git commit -qm "after guard"
          signoff audit --since-install
          signoff p4 checkpoint --no-sign
          signoff p4 verify --checkpoint --allow-unsigned
          signoff p4 path --json
          signoff doctor --json > doctor.json
          node -e "const d=require('/tmp/guarded/doctor.json'); if(!d.ok||d.fails) process.exit(1); console.log('doctor ok,', d.checks.length, 'checks')"

  arm:
    name: linux arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: node test/selftest.js

  container:
    name: container (node:22-slim, no host tools)
    runs-on: ubuntu-latest
    container: node:22-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: self-test without a host git identity
        run: |
          apt-get update -qq && apt-get install -y -qq git openssh-client > /dev/null
          git config --global user.name ci
          git config --global user.email ci@example.com
          node test/selftest.js
