# Retire a registry version that npm never served (clients would 404 on install).
# Local `mcp-publisher status` needs a device-code login; GitHub Actions proves the same
# identity with OIDC instead, so this runs unattended.
name: mcp-registry-retire
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to mark deleted"
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.8/mcp-publisher_linux_amd64.tar.gz
          tar xzf mcp-publisher.tar.gz mcp-publisher
          sudo install -m 0755 mcp-publisher /usr/local/bin/mcp-publisher
      - name: Retire ${{ inputs.version }}
        run: |
          set -euo pipefail
          NAME=$(jq -r .name server.json)
          VERSION="${{ inputs.version }}"
          mcp-publisher login github-oidc
          mcp-publisher status --status deleted \
            --message "$VERSION never reached npm; superseded by the current release" \
            "$NAME" "$VERSION"
