# Publishing to the official MCP Registry used to need a device-code login every ~30 min.
# GitHub Actions can prove the repository identity with OIDC instead, so a release is enough.
# generated by signoff-cli -- remove with: signoff uninstall
name: mcp-registry
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.8/mcp-publisher_linux_amd64.tar.gz
          # 校验和钉死：URL 换版本时必须同步改这一行，否则这一步会红
          echo "09f1fa70ee146b640584274a1a6b2b8a0310b05d4321fa9224e6df6a016d67f4  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          sudo install -m 0755 mcp-publisher /usr/local/bin/mcp-publisher
      - name: Wait for npm to serve this version
        # npm publishes in stages: `npm publish` returns + pkg@ver while the registry still
        # answers 404 for a few minutes. The registry validates against npm, so publishing
        # too early fails with "version ... was not found". Wait for the fact, not the guess.
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version server.json)
          PKG=$(jq -r '.packages[0].identifier' server.json)
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            TAG="${GITHUB_REF_NAME}"
            if [ "$TAG" != "v$VERSION" ] && [ "$TAG" != "$VERSION" ]; then
              echo "release $TAG does not match server.json version $VERSION" >&2
              exit 1
            fi
          fi
          URL="https://registry.npmjs.org/$(printf '%s' "$PKG" | sed 's|/|%2f|')/$VERSION"
          echo "waiting for $PKG@$VERSION ($URL)"
          for i in $(seq 1 40); do
            if curl -fsS --max-time 20 "$URL" -o /dev/null; then
              echo "npm serves $PKG@$VERSION after ~$((i * 15))s"
              exit 0
            fi
            sleep 15
          done
          echo "npm never served $PKG@$VERSION within 10 minutes" >&2
          exit 1

      - name: Authenticate and publish
        # One refusal is not a reason to leave a release unpublished by hand. After each
        # failure, re-check npm (propagation can lag again) and back off further.
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4; do
            if mcp-publisher login github-oidc && mcp-publisher publish; then
              exit 0
            fi
            echo "attempt $attempt failed; re-checking npm and retrying in $((attempt * 20))s" >&2
            VERSION=$(jq -r .version server.json)
            PKG=$(jq -r '.packages[0].identifier' server.json)
            curl -fsS --max-time 20 "https://registry.npmjs.org/$(printf '%s' "$PKG" | sed 's|/|%2f|')/$VERSION" -o /dev/null || echo "npm still not serving it" >&2
            sleep $((attempt * 20))
          done
          exit 1
