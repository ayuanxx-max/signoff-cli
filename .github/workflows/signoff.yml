# generated by signoff-cli -- remove with: signoff uninstall
name: signoff
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "20" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11" }
      - run: npx --yes --package=signoff-cli@4.6.2 signoff guard --ci
      - name: audit trailers
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          # A shallow clone has no history, and `git rev-parse HEAD~1` echoes the missing
          # name instead of failing, so ask for a verified commit hash or nothing at all.
          BASE="${GITHUB_EVENT_BEFORE}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git fetch --unshallow --quiet 2>/dev/null || git fetch --deepen=50 --quiet 2>/dev/null || true
            BASE=$(git rev-parse --verify --quiet "HEAD~1^{commit}" || true)
          fi
          if [ -n "$BASE" ]; then
            npx --yes --package=signoff-cli@4.6.2 signoff audit --range "$BASE..HEAD"
          else
            echo "no base commit in this clone; skipping the trailer audit"
          fi
      - name: release gate (artifact)
        run: npx --yes --package=signoff-cli@4.6.2 signoff release --pre
