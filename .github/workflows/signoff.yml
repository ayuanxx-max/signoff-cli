# generated by signoff-cli -- remove with: signoff uninstall
name: signoff
# 只要分支，不要 tag：推 tag 时 publish.yml 已经在同一个 sha 上跑全套，
# 再加上这一步就是第三次跑同一份用例（实测多花 40 余秒，还多占一个 runner）。
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
# 同一分支连着推时，前一次没有信息价值了：取消它，别排队。
concurrency:
  group: signoff-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "20" }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.11" }
      # npx dedupes the spec to this project when the repo under guard is signoff-cli
      # itself, installs nothing and leaves `signoff` off PATH (exit 127, no gate ran).
      - run: npm i -g --silent signoff-cli@4.7.1
      - run: signoff guard --ci
      # The installed cli bootstraps a fresh clone (empty .git/hooks) and, before 4.8,
      # rewrote this file with its stock template. This repo's version is the truth.
      - run: git checkout -- .github/workflows/signoff.yml
      # p1 reports a red suite as "rc=1" and keeps the detail to itself, which leaves a
      # red gate with no reason on CI (there is no local hook.log to open). Re-run the
      # same suite here so the failing case is named in the log.
      - name: suite detail
        if: always()
        run: node test/selftest.js || true
      - name: audit trailers
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          # A shallow clone has no history, and `git rev-parse HEAD~1` echoes the missing
          # name instead of failing, so ask for a verified commit hash or nothing at all.
          BASE="${GITHUB_EVENT_BEFORE}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git fetch --unshallow --quiet 2>/dev/null || git fetch --deepen=50 --quiet 2>/dev/null || true
            BASE=$(git rev-parse --verify --quiet "HEAD~1^{commit}" || true)
          fi
          if [ -n "$BASE" ]; then
            signoff audit --range "$BASE..HEAD"
          else
            echo "no base commit in this clone; skipping the trailer audit"
          fi
      - name: release gate (artifact)
        run: signoff release --pre
